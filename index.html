<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Home Car Clean</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background: rgb(128, 128, 128);
    }

    .wheel-area {
      min-height: 100vh;
      width: 100%;
      display: grid;
      place-items: center;
    }

    .wheel-frame {
      width: min(84vw, 84vh, 560px);
      aspect-ratio: 1;
      border: 0;
      background: transparent;
      display: block;
    }
  </style>
</head>

<body>

  <main class="wheel-area">
    <iframe
      class="wheel-frame"
      src="75FA037D-8529-4688-BBD8-BC4CD6A1F9F4.png"
      title="Home Car Clean wheel">
    </iframe>
  </main>

</body>
</html>
