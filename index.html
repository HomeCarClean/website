<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Home Car Clean</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      min-height: 100vh;
      background: rgb(128, 128, 128);
      overflow: hidden;
    }

    .wheel-area {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .wheel-frame {
      position: absolute;
      width: 100vh;
      height: 100vh;
      right: -50vh;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      display: block;

  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;

    }
  </style>
</head>

<body>

  <main class="wheel-area">
    <iframe
      class="wheel-frame"
      src="9C8078D5-C511-44E8-BB03-
04B5A167A759.png"
      title="Home Car Clean wheel">
    </iframe>
  </main>

</body>
</html>
