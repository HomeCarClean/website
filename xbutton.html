<!doctype html>
<html>
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HomeCarClean X Button</title>
<style>
* {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

background: rgb(128, 128, 128);
      font-family: Arial, Helvetica, sans-serif;
    }

    .x-link {
      display: inline-flex;
      align-items: center;
      gap: 18px;

      padding: 10px 16px 10px 20px;

      background: #000000;
      color: #ffffff;

      border-radius: 999px;
      text-decoration: none;

      font-size: 26px;
      font-weight: 700;

      transition: transform 0.15s ease;
    }

    .x-link:active {
      transform: scale(0.97);
    }

    .x-logo {
  font-size: 50px;
  font-weight: 400;
  line-height: 0.8;
  transform: translateX(-6px);
}
</style>
</head>
<body>
<a
    class="x-link"
    href="https://x.com/HomeCarClean"
    target="_blank"
    rel="noopener noreferrer"
  >
    <span>@HomeCarClean</span>
    <span class="x-logo">𝕏</span>
  </a>
</body>
</html>
